<div class="auth-container">
    <div class="auth-card">
        <h2>Registrieren</h2>
        <p>Tritt der Welt von Pen & Paper bei</p>
        <div class="form-group">
            <label>Benutzername</label>
            <input type="text" placeholder="Wähle deinen Namen" />
        </div>
        <div class="form-group">
            <label>E-Mail</label>
            <input type="email" placeholder="deine@email.de" />
        </div>
        <div class="form-group">
            <label>Passwort</label>
            <input type="password" placeholder="Streng geheim" />
        </div>
        <button class="primary-btn" routerLink="/login">Registrieren (Klick-Dummy)</button>
    </div>
</div>

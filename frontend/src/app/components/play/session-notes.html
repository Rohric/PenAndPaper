<form class="list-row" (ngSubmit)="add()">
  <input class="input" name="quickTitle" autocomplete="off" aria-label="Schnelle Notiz" placeholder="Schnelle Notiz, der Titel genügt" [ngModel]="title()" (ngModelChange)="title.set($event)" />
  <button type="submit" class="btn btn--primary" [disabled]="!title().trim()"><app-icon name="plus" [size]="16" /> Notiz</button>
</form>

<div class="stack tools">
  <input class="input" aria-label="Notizen suchen" placeholder="Notizen durchsuchen" [ngModel]="query()" (ngModelChange)="query.set($event)" />
  <div class="row">
    <button type="button" class="pill" [attr.aria-pressed]="filter() === 'all'" (click)="filter.set('all')">Alle</button>
    <button type="button" class="pill" [attr.aria-pressed]="filter() === 'mine'" (click)="filter.set('mine')">Meine</button>
    <button type="button" class="pill" [attr.aria-pressed]="filter() === 'group'" (click)="filter.set('group')">Gruppe</button>
    <button type="button" class="pill" [attr.aria-pressed]="newest()" (click)="newest.set(!newest())">{{ newest() ? 'Neueste zuerst' : 'A–Z' }}</button>
  </div>
</div>

<div class="board">
  @if (showOwn()) {
    <section class="stack">
      <h3 class="section-title"><app-icon name="note" /> Meine Notizen · {{ own().length }}</h3>
      <div class="tiles">
        @for (note of own(); track note.id) {
          <button type="button" class="tile note" (click)="open.emit(note.id)">
            <span class="kicker">{{ ago(note.created_at) }}</span>
            <span class="tile__title">{{ note.title }}</span>
            @if (note.text) {
              <span class="soft clamp">{{ note.text }}</span>
            }
          </button>
        } @empty {
          <p class="soft">Keine eigene Notiz.</p>
        }
      </div>
    </section>
  }

  @if (showGroup()) {
    <section class="stack">
      <h3 class="section-title"><app-icon name="group" /> Gruppenblock · {{ group().length }}</h3>
      <div class="tiles">
        @for (note of group(); track note.id) {
          <button type="button" class="tile note note--group" (click)="open.emit(note.id)">
            <span class="kicker">von {{ note.author }} · {{ ago(note.created_at) }}</span>
            <span class="tile__title">{{ note.title }}</span>
            @if (note.text) {
              <span class="soft clamp">{{ note.text }}</span>
            }
            @if (note.comments.length) {
              <span class="chip">{{ note.comments.length }} {{ note.comments.length === 1 ? 'Kommentar' : 'Kommentare' }}</span>
            }
          </button>
        } @empty {
          <p class="soft">Der Gruppenblock ist leer.</p>
        }
      </div>
    </section>
  }
</div>

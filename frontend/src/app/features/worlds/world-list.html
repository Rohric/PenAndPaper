<section class="stack">
  <header class="row row--between">
    <div>
      <span class="kicker">Spielleiter</span>
      <h1 class="title">Welten</h1>
    </div>
    <app-tutorial-button topic="start" />
  </header>

  <form class="list-row create" (ngSubmit)="create()">
    <input class="input" name="newName" aria-label="Name der neuen Welt" placeholder="Name der neuen Welt" [(ngModel)]="newName" />
    <button type="submit" class="btn btn--primary" [disabled]="!newName().trim()">Welt anlegen</button>
  </form>

  @if (error()) {
    <p class="notice notice--error" role="alert">{{ error() }}</p>
  }

  <div class="cards">
    @for (world of worlds(); track world.id) {
      <a class="card" [routerLink]="['/gm/worlds', world.id]">
        <span class="kicker">Welt</span>
        <span class="card__title">{{ world.name }}</span>
        @if (world.lore) {
          <span class="soft clamp">{{ world.lore }}</span>
        }
      </a>
    }
  </div>

  @if (!worlds().length) {
    <div class="empty">
      <p>Noch keine Welt. Gib oben einen Namen ein und leg deine erste an.</p>
    </div>
  }
</section>

<details class="panel fold">
  <summary>
    <span class="card__title">{{ scene().name }}</span>
    @if (locationName()) {
      <span class="chip chip--info">{{ locationName() }}</span>
    }
  </summary>

  <div class="stack">
    <div class="grid-fields">
      <div class="field">
        <label [for]="'scene-name-' + scene().id">Name</label>
        <input [id]="'scene-name-' + scene().id" class="input" [ngModel]="draft().name" (ngModelChange)="set('name', $event)" />
      </div>
      <div class="field">
        <label [for]="'scene-position-' + scene().id">Platz in der Liste</label>
        <input
          [id]="'scene-position-' + scene().id"
          class="input input--number"
          type="number"
          min="0"
          [ngModel]="draft().position"
          (ngModelChange)="setPosition($event)"
        />
      </div>
    </div>
    <div class="field">
      <label [for]="'scene-text-' + scene().id">Text</label>
      <textarea [id]="'scene-text-' + scene().id" class="input" rows="5" [ngModel]="draft().text" (ngModelChange)="set('text', $event)"></textarea>
    </div>
    <div class="field">
      <label [for]="'scene-read-' + scene().id">Zum Vorlesen</label>
      <textarea [id]="'scene-read-' + scene().id" class="input" rows="4" [ngModel]="draft().to_read" (ngModelChange)="set('to_read', $event)"></textarea>
    </div>
    <div class="field">
      <label [for]="'scene-location-' + scene().id">Ort</label>
      <app-id-select
        emptyLabel="Kein Ort"
        [inputId]="'scene-location-' + scene().id"
        [options]="store.locationOptions()"
        [value]="draft().location"
        (valueChange)="set('location', $event)"
      />
    </div>
    <div class="field">
      <span class="label">Figuren in der Szene</span>
      <app-pill-multi-select
        label="Figuren in der Szene"
        emptyText="Diese Welt hat noch keine Figuren."
        [options]="store.npcOptions()"
        [selected]="draft().npcs"
        (selectedChange)="set('npcs', $event)"
      />
    </div>
    <app-editor-bar [dirty]="dirty()" [busy]="busy()" [error]="error()" (save)="save()" (remove)="remove()" />
  </div>
</details>

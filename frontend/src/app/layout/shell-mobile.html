@if (nav.mode() === 'gm') {
<header class="bar">
  <button
    type="button"
    class="menu-btn"
    aria-label="Menü"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 7h16" />
      <path d="M4 12h16" />
      <path d="M4 17h16" />
    </svg>
  </button>
  <div class="bar__text">
    <span class="kicker">{{ nav.modeLabel() }}</span>
    <span class="bar__name">Pen &amp; Paper</span>
  </div>
</header>

}

@if (nav.mode() === 'gm' && open()) {
  <nav class="menu" aria-label="Hauptmenü">
    @if (nav.canSwitch()) {
      <div class="menu__group" role="group" aria-label="Bereich wechseln">
        @for (mode of nav.modes; track mode.id) {
          <button
            type="button"
            class="pill"
            [attr.aria-pressed]="nav.mode() === mode.id"
            (click)="switchTo(mode.id)"
          >
            {{ mode.label }}
          </button>
        }
      </div>
    }

    @for (item of nav.items(); track item.path) {
      <a class="menu__link" [routerLink]="item.path" routerLinkActive="is-active" (click)="close()">
        {{ item.label }}
      </a>
    }

    <button type="button" class="btn" (click)="openHelp()">? Hilfe</button>

    <div class="menu__account">
      <span class="soft">{{ auth.account()?.username }}</span>
      <button type="button" class="btn" (click)="auth.logout()">Abmelden</button>
    </div>
  </nav>
}

<main class="main">
  <ng-content />
</main>

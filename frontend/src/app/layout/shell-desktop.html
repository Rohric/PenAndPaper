<div class="shell">
  <aside class="side" aria-label="Hauptmenü">
    <div class="brand">
      <span class="kicker">How to be a Hero</span>
      <span class="brand__name">Pen &amp; Paper</span>
    </div>

    @if (nav.canSwitch()) {
      <div class="modes" role="group" aria-label="Bereich wechseln">
        @for (mode of nav.modes; track mode.id) {
          <button
            type="button"
            class="pill"
            [attr.aria-pressed]="nav.mode() === mode.id"
            (click)="nav.switchTo(mode.id)"
          >
            {{ mode.label }}
          </button>
        }
      </div>
    }

    <nav class="links" aria-label="Seiten">
      @for (item of nav.items(); track item.path) {
        <a class="link" [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
      }
    </nav>

    <div class="account">
      <span class="kicker">Angemeldet als</span>
      <span class="account__name">{{ auth.account()?.username }}</span>
      <button type="button" class="btn" (click)="auth.logout()">Abmelden</button>
    </div>
  </aside>

  <main class="main">
    <ng-content />
  </main>
</div>

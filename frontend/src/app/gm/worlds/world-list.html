<section class="stack">
  @if (error()) {
    <p class="notice notice--error" role="alert">{{ error() }}</p>
  }

  <div class="cards">
    @for (world of worlds(); track world.id) {
      <a class="card" [routerLink]="['/gm/worlds', world.id]">
        <span class="kicker">Welt</span>
        <span class="card__title">{{ world.name }}</span>
        @if (world.lore) {
          <span class="soft clamp">{{ world.lore }}</span>
        }
      </a>
    }
  </div>

  @if (!worlds().length) {
    <div class="empty">
      <p>Noch keine Welt. Mit „Neu“ unten in der Leiste legst du deine erste an.</p>
    </div>
  }
</section>

@if (creating()) {
  <app-name-dialog title="Neue Welt" label="Name der Welt" hint="Die Welt öffnet sich danach; dort schreibst du Kapitel und Glossar." [error]="error()" (create)="create($event)" (closed)="creating.set(false)" />
}

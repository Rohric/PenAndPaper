@if (store.error()) {
  <p class="notice notice--error" role="alert">{{ store.error() }}</p>
}

@if (store.world()) {
  <router-outlet />
}

<ng-template #searchBox>
  @if (store.world()) {
    <app-world-search />
  }
</ng-template>

<ng-template #recentPop>
  <app-recent-entries />
</ng-template>

<app-entry-popup />
<app-entry-peek />

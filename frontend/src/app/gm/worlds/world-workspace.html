<section class="stack">
  <header class="bar bar--top">
    <div class="bar__title">
      <a class="btn btn--small" routerLink="/gm/worlds" aria-label="Alle Welten"><app-icon name="back" /></a>
      <div>
        <span class="kicker">Welt</span>
        <h1 class="subtitle">{{ store.world()?.name }}</h1>
      </div>
    </div>
    <nav class="row" aria-label="Teile der Welt">
      <a class="btn" routerLink="chapters" routerLinkActive ariaCurrentWhenActive="page"><app-icon name="book" /> Kapitel</a>
      <a class="btn" routerLink="glossary" routerLinkActive ariaCurrentWhenActive="page"><app-icon name="archive" /> Glossar</a>
      <button type="button" class="btn" [attr.aria-pressed]="recentOpen()" (click)="recentOpen.set(!recentOpen())">
        <app-icon name="clock" /> Zuletzt
      </button>
      @if (store.world()) {
        <app-world-search />
      }
    </nav>
  </header>

  @if (store.error()) {
    <p class="notice notice--error" role="alert">{{ store.error() }}</p>
  }

  @if (store.world()) {
    <router-outlet />
  }
</section>

@if (recentOpen()) {
  <app-side-panel title="Zuletzt in dieser Welt" (closed)="recentOpen.set(false)">
    <app-recent-entries (opened)="recentOpen.set(false)" />
  </app-side-panel>
}

<app-entry-peek />

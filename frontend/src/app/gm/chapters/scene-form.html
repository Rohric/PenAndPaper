<article class="panel doc">
  <div class="row row--between">
    <span class="kicker">Szene bearbeiten</span>
    <div class="row">
      <span class="soft" role="status">{{ statusText() }}</span>
      <button type="button" class="btn btn--small btn--danger" (click)="remove()"><app-icon name="trash" [size]="16" /> Löschen</button>
    </div>
  </div>

  @if (error()) {
    <p class="notice notice--error" role="alert">{{ error() }}</p>
  }

  <input
    #title
    class="doc__title"
    aria-label="Name der Szene"
    placeholder="Name der Szene"
    [value]="draft().name"
    (input)="set('name', $any($event.target).value)"
  />

  <label class="check">
    <input type="checkbox" [checked]="draft().optional" (change)="set('optional', $any($event.target).checked)" />
    Optionale Szene: hängt nicht am roten Faden und kann eingesetzt werden, wo sie passt
  </label>

  <app-category-field inputId="scene-category" kind="scenes" [value]="draft().category" (valueChange)="set('category', $event)" />

  <div class="doc__line">
    <label for="scene-location">Ort</label>
    <app-link-picker
      single
      inputId="scene-location"
      label="Ort der Szene"
      emptyText="Wo spielt die Szene?"
      [options]="store.locationOptions()"
      [value]="draft().location"
      [creatable]="true"
      (valueChange)="set('location', $event)"
      (create)="addPlace($event)"
      (look)="lookUp('locations', $event)"
    />
  </div>
  <div class="doc__line">
    <label for="scene-npcs">Figuren</label>
    <app-link-picker
      inputId="scene-npcs"
      label="Figuren in der Szene"
      emptyText="Wer tritt auf?"
      [creatable]="true"
      [options]="store.npcOptions()"
      [selected]="draft().npcs"
      (selectedChange)="set('npcs', $event)"
      (create)="addNew('npcs', $event)"
      (look)="lookUp('npcs', $event)"
    />
  </div>

  <div class="read-aloud">
    <label class="kicker" for="scene-read">Vorlesen</label>
    <textarea
      id="scene-read"
      class="doc__text"
      rows="2"
      placeholder="Was du den Spielern vorliest …"
      [appAutoGrow]="draft().to_read"
      [value]="draft().to_read"
      (input)="set('to_read', $any($event.target).value)"
    ></textarea>
  </div>

  <div class="field">
    <label for="scene-text">Was passiert</label>
    <textarea
      id="scene-text"
      class="doc__text"
      rows="4"
      placeholder="Was in der Szene geschieht, was die Figuren wollen, was schiefgehen kann …"
      [appAutoGrow]="draft().description"
      [value]="draft().description"
      (input)="set('description', $any($event.target).value)"
    ></textarea>
  </div>

  <app-note-field inputId="scene-note" [value]="draft().note" (valueChange)="set('note', $event)" />

  <div class="field">
    <span class="label">Dialoge</span>
    <app-dialogue-list-editor
      [dialogues]="draft().dialogues"
      [speakers]="store.npcOptions()"
      [newSpeaker]="newSpeaker"
      (dialoguesChange)="set('dialogues', $event)"
      (look)="lookUp('npcs', $event)"
    />
  </div>

  <div class="doc__line">
    <label for="scene-events">Ereignisse</label>
    <app-link-picker
      inputId="scene-events"
      label="Ereignisse der Szene"
      emptyText="Was kann hier passieren?"
      [creatable]="true"
      [options]="store.eventOptions()"
      [selected]="draft().events"
      (selectedChange)="set('events', $event)"
      (create)="addNew('events', $event)"
      (look)="lookUp('events', $event)"
    />
  </div>
  <div class="doc__line">
    <label for="scene-quests">Quests</label>
    <app-link-picker
      inputId="scene-quests"
      label="Quests der Szene"
      emptyText="Welche Quests spielen hier eine Rolle?"
      [creatable]="true"
      [options]="store.questOptions()"
      [selected]="draft().quests"
      (selectedChange)="set('quests', $event)"
      (create)="addNew('quests', $event)"
      (look)="lookUp('quests', $event)"
    />
  </div>
  <div class="doc__line">
    <label for="scene-trivia">Wissen</label>
    <app-link-picker
      inputId="scene-trivia"
      label="Wissen und Gegenstände der Szene"
      emptyText="Wissen oder Gegenstände, die hier wichtig sind"
      [creatable]="true"
      [options]="store.triviaOptions()"
      [selected]="draft().trivia"
      (selectedChange)="set('trivia', $event)"
      (create)="addNew('trivia', $event)"
      (look)="lookUp('trivia', $event)"
    />
  </div>
  <div class="doc__line">
    <label for="scene-next">Führt zu</label>
    <app-link-picker
      inputId="scene-next"
      label="Szenen, zu denen diese führt"
      emptyText="Welche Szene kann folgen?"
      [options]="otherScenes()"
      [selected]="draft().leads_to"
      [creatable]="true"
      (selectedChange)="set('leads_to', $event)"
      (create)="addNext($event)"
      (look)="lookUp('scenes', $event)"
    />
  </div>

  <p class="soft">
    Tab springt zum nächsten Feld. In einem Verknüpfungsfeld: tippen sucht, Pfeiltasten wählen, Enter verknüpft, die Rücktaste nimmt
    den letzten Eintrag weg. Ein Klick auf einen verknüpften Eintrag öffnet sein Popup.
  </p>
</article>

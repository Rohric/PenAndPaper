<div class="list-container" *ngIf="character">
    <div class="header-action">
        <h2>Deine Charaktere</h2>
    </div>
    <div class="character-grid">
        <div class="character-card" [routerLink]="['/characters', character.id]">
            <div class="card-header">
                <h3>{{ character.name }}</h3>
                <span class="class-badge">{{ character.beruf }}</span>
            </div>
            <div class="card-body">
                <p><strong>Alter:</strong> {{ character.alter }} Jahre</p>
                <p><strong>Geschlecht:</strong> {{ character.geschlecht }}</p>
                <p class="health-info">❤️ {{ character.health_points }} HP</p>
            </div>
        </div>
    </div>
</div>
